[project]
name = "backend"
version = "0.1.0"
description = "Agentic chatbot backend with OpenAI, Mem0, and Supabase"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "python-dotenv>=1.0.1",
    "openai>=1.100.2",
    "mem0ai>=0.1.116",
    "supabase>=2.18.1",
    "vecs>=0.4.5",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
